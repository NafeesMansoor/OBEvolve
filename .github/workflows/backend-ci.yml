name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: obevolve
          POSTGRES_PASSWORD: obevolve
          POSTGRES_DB: obevolve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U obevolve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          source .venv/bin/activate
          ruff check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://obevolve:obevolve@localhost:5432/obevolve_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-test-secret
        run: |
          source .venv/bin/activate
          pytest
