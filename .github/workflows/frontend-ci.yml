name: frontend-ci

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check + build
        run: npm run build

      - name: Verify copyright footer is present
        run: |
          if ! grep -q "© 2026 Prof.Naf. All rights reserved." src/components/footer.tsx; then
            echo "::error file=frontend/src/components/footer.tsx::Copyright notice is missing or was altered. Restore the exact text before merging."
            exit 1
          fi
